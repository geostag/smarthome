name: Build And Push Scripts Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - ".dockerignore"
      - ".github/workflows/build-and-push-sensors-image.yml"
      - "sensors/bin/**"
      - "sensors/sensors-entrypoint.sh"
      - "sensors/sensors.Dockerfile"
      - "requirements.txt"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/build-and-push-sensors-image.yml"
      - "sensors/bin/**"
      - "sensors/sensors-entrypoint.sh"
      - "sensors/sensors.Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Derive Image Name
        id: vars
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${GITHUB_REPOSITORY}")"
          repo="$(printf '%s' "${repo}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}-scripts" >> "${GITHUB_OUTPUT}"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build And Push Scripts Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sensors/sensors.Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
